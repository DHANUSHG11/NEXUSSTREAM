<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - NEXUSTREAM</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page">
<div class="auth-container">
    <h1><a href="{{ url_for('home') }}">NEXUSTREAM</a></h1>
    <h2>Reset Password</h2>
    <p class="auth-subtitle">Use the recovery code you received when you created your account.</p>
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <div class="flash-message {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}
    <form method="POST">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required>
        <label for="recovery_code">Recovery Code</label>
        <input type="text" id="recovery_code" name="recovery_code" required>
        <label for="new_password">New Password</label>
        <input type="password" id="new_password" name="new_password" required>
        <button type="submit" class="primary-button">Reset Password</button>
    </form>
    <p class="auth-footer"><a href="{{ url_for('login') }}">Back to Login</a></p>
</div>
</body>
</html>
