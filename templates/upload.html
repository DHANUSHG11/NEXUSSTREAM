<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload - NEXUSTREAM</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <header>
        <div class="logo">
            <a href="{{ url_for('home') }}">NEXUSTREAM</a>
        </div>

        <nav class="nav-menu">
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('upload') }}">Upload Videos</a>
            <a href="{{ url_for('logout') }}">Sign Out</a>
        </nav>
    </header>

    <main class="form-page">
        <div class="form-container">
            <h1>Upload a Video</h1>
            <p class="form-subtitle">Add a video to the NEXUSTREAM home feed.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash-message {{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('upload') }}" enctype="multipart/form-data" method="POST">

                <div class="form-group">
                    <label for="title">Title</label>
                    <input type="text" id="title" name="title" required>
                </div>

                <div class="form-group">
                    <label for="categories">Category</label>
                    <input
                        list="categories-option"
                        name="categories"
                        id="categories"
                        placeholder="Choose a category"
                        required
                    >

                    <datalist id="categories-option">
                        <option value="Gaming">
                        <option value="Music">
                        <option value="Education">
                        <option value="Vlogs">
                        <option value="Technology">
                        <option value="Cooking">
                        <option value="Sports">
                        <option value="News">
                        <option value="Comedy">
                        <option value="Fitness">
                        <option value="Entertainment">
                    </datalist>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea
                        id="description"
                        name="description"
                        placeholder="Write your description"
                        rows="5"
                    ></textarea>
                </div>

                <div class="form-group">
                    <label for="file">Video File</label>
                    <input
                        type="file"
                        id="file"
                        name="file"
                        accept="video/*"
                        required
                    >
                </div>

                <button type="submit" class="primary-button">
                    Upload Video
                </button>

            </form>
        </div>
    </main>

</body>
</html>
